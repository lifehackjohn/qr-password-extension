name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Package extension
        run: |
          cd extension
          zip -r ../qr-password-extension-${{ github.ref_name }}.zip . -x ".*"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: qr-password-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
