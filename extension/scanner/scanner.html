<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Password Scanner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .camera-box {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4/3;
      margin-bottom: 16px;
    }

    #camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scan-canvas { display: none; }

    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }

    .status {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }

    /* Result */
    .result-box {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      display: none;
    }

    .result-box.visible { display: block; }

    .password-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 12px;
    }

    .password-text {
      flex: 1;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 16px;
      text-align: left;
      word-break: break-all;
      user-select: all;
    }

    .icon-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      font-size: 18px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      margin: 4px;
    }

    .btn-primary {
      background: #4169E1;
      color: white;
    }

    .btn-primary:hover {
      background: #3457b8;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Scan QR Code</h1>

    <div class="camera-box" id="camera-box">
      <video id="camera-preview" autoplay playsinline></video>
      <canvas id="scan-canvas"></canvas>
      <div class="scan-frame"></div>
    </div>

    <p class="status" id="status">Starting camera...</p>

    <div class="result-box" id="result-box">
      <div class="password-row">
        <span class="password-text" id="password-text">••••••••</span>
        <button class="icon-btn" id="btn-toggle" title="Show/Hide">👁️</button>
        <button class="icon-btn" id="btn-copy" title="Copy">📋</button>
      </div>
    </div>

    <div>
      <button class="btn btn-secondary" id="btn-again">Scan Again</button>
      <button class="btn btn-secondary" id="btn-close">Close</button>
    </div>
  </div>

  <script src="../lib/jsQR.min.js"></script>
  <script src="scanner.js"></script>
</body>
</html>
