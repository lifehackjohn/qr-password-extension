<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Password Fill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      width: 280px;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 28px;
    }

    h1 {
      font-size: 16px;
      font-weight: 500;
    }

    p {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #4169E1;
      color: white;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #3457b8;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔐</span>
    <h1>QR Password Fill</h1>
  </div>

  <p>Scan a QR code from your air-gapped device to copy credentials.</p>

  <button class="btn" id="btn-scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Scan QR Code
  </button>

  <script src="popup.js"></script>
</body>
</html>
